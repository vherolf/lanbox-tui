name: Release binaries

# Builds standalone lanbox-tui / lanbox-simulator binaries (no Python needed)
# for Linux x86_64 and macOS arm64 whenever a major version tag - v4.0.0,
# v5.0.0, ... - is pushed, and attaches them to that tag's GitHub release
# (creating the release if it doesn't exist yet). "Run workflow" on the
# Actions tab builds and tests without releasing anything.

on:
  push:
    tags:
      - "v[0-9]+.0.0"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Build on Debian 12 (glibc 2.36) rather than the runner's newer Ubuntu,
    # so the binary also runs on older distributions.
    container: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in pyproject.toml ($version)"
            exit 1
          fi

      - name: Install
        run: python -m pip install -e ".[dev]" "pyinstaller>=6.10"

      - name: Test
        run: python -m pytest -q

      - name: Build and smoke-test binaries
        run: packaging/build.sh linux-x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]" "pyinstaller>=6.10"

      - name: Test
        run: python -m pytest -q

      - name: Build and smoke-test binaries
        run: packaging/build.sh macos-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist/*.tar.gz --clobber
