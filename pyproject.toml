[project]
name = "lanbox-tui"
version = "4.0.0"
description = "Modern Linux/Unix TUI client for LanBox DMX controllers"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
]

[project.scripts]
lanbox-tui = "lanbox_tui.tui.app:run"
lanbox-simulator = "lanbox_tui.simulator.server:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fail a hung test after 2 minutes (with a traceback) instead of hanging CI.
timeout = 120
testpaths = ["tests"]
